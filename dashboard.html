<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockWeb 交易總管 - Dashboard</title>
    <link rel="stylesheet" href="src/css/dashboard.css">
</head>
<body class="dashboard-body">

    <!-- 頂部功能列 -->
    <header class="dashboard-header">
        <div class="header-brand">StockWeb 交易總管</div>
        <div class="header-actions">
            <span class="user-badge" id="current-user-badge">連線中...</span>
            <!-- 新增：前往 S3 個股明細的按鈕 -->
            <button type="button" id="btn-goto-tradinglog" class="btn-primary-action">進入個股記錄</button>
            <button type="button" id="btn-mask-toggle" class="btn-icon" title="隱藏/顯示金額">👁️</button>
            <button type="button" id="btn-logout" class="btn-secondary">登出</button>
        </div>
    </header>

    <!-- S2 主內容：上下雙區塊 -->
    <main class="dashboard-content">
        
        <!-- 上方區塊：6 大財務統計指標卡片 (Grid 排版) -->
        <section class="kpi-grid">
            <!-- 1. 入金合計 -->
            <div class="kpi-card">
                <span class="kpi-label">入金合計</span>
                <span class="kpi-value" data-index="0">-</span>
                <span class="kpi-sub">累計存入本金</span>
            </div>

            <!-- 2. 利息合計 -->
            <div class="kpi-card">
                <span class="kpi-label">利息合計</span>
                <span class="kpi-value" data-index="1">-</span>
                <span class="kpi-sub">累計股利/配息</span>
            </div>

            <!-- 3. 期望回收 -->
            <div class="kpi-card">
                <span class="kpi-label">期望回收</span>
                <span class="kpi-value" data-index="2">-</span>
                <span class="kpi-sub">本金 + 目標利得</span>
            </div>

            <!-- 4. 當前現金 -->
            <div class="kpi-card">
                <span class="kpi-label">當前現金</span>
                <span class="kpi-value" data-index="3">-</span>
                <span class="kpi-sub">可用交割款餘額</span>
            </div>

            <!-- 5. 當前損益 (不含利息) -->
            <div class="kpi-card">
                <span class="kpi-label">當前損益 (不含利息)</span>
                <span class="kpi-value" data-index="4">-</span>
                <span class="kpi-sub" id="sub-pnl-noint">-</span>
            </div>

            <!-- 6. 當前損益 (含利息) -->
            <div class="kpi-card">
                <span class="kpi-label">當前損益 (含利息)</span>
                <span class="kpi-value" data-index="5">-</span>
                <span class="kpi-sub" id="sub-pnl-int">-</span>
            </div>
        </section>

        <!-- 下方區塊：近期進出流水帳 (唯讀匯總) -->
        <section class="ledger-section">
            <div class="ledger-header">
                <div>
                    <h2>近期進出流水帳</h2>
                    <p class="ledger-tip">由各股明細自動聚合，僅供查閱</p>
                </div>
            </div>

            <div class="table-container">
                <table class="ledger-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>標的</th>
                            <th>類型</th>
                            <th class="text-right">收入</th>
                            <th class="text-right">支出</th>
                            <th>備註</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-body">
                        <!-- 由 JS 動態注入 -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    <!-- 先引入客戶端認證輔助，再載入儀表板主要邏輯 -->
    <script src="./src/js/client-auth.js"></script>
    <script src="./src/js/dashboard.js"></script>
</body>


</html>
