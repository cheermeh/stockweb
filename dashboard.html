<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWeb - Dashboard</title>

  <!-- 宣告藍色折線圖 Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 7 13.5 15.5 8.5 10.5 2 17'%3E%3C/polyline%3E%3Cpolyline points='16 7 22 7 22 13'%3E%3C/polyline%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 載入專屬 CSS -->
  <link rel="stylesheet" href="./src/css/dashboard.css">

  <!-- 2026.10.08 feat: 載入 Clerk 前端 SDK，供 API 請求取得 Token -->
  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YWN0aXZlLW9jdG9wdXMtMjgzNi5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://active-octopus-2836.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js">
    </script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
  <!-- 頂部導航列 -->
  <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="text-blue-500">StockWeb</span> 儀表板
      </h1>

      <!-- [2026-10-06] 異動說明
           目的：改為 Market: [市場下拉選單] 與 User: [帳號明碼] 樣式
           實作說明：膠囊內分別呈現 Market 選擇器與 User 帳號文字 -->
      <div id="badge-market-container"
        class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-blue-900/60 text-blue-300 border border-blue-700/50">
        <!-- 1. Market: 市場下拉選單 -->
        <div class="flex items-center gap-1">
          <span class="text-blue-400 font-semibold">Market:</span>
          <!-- 2026.10.08 feat: 選項由 dashboard.js 依 GET_DISTINCT_MARKETS_BY_STOCK 的查詢結果動態產生 -->
          <!-- 2026.10.09 fix: 預設 disabled 防止載入中被點擊產生破圖白邊 (修正全形引號錯誤) -->
          <select id="select-market" disabled
            class="bg-transparent text-white font-semibold focus:outline-none cursor-pointer disabled:cursor-not-allowed disabled:opacity-60">
            <option value="">載入市場中...</option>
          </select>
        </div>

        <span class="text-blue-700/80">|</span>

        <!-- 2. User: 帳號明碼呈現 -->
        <div class="flex items-center gap-1">
          <span class="text-blue-400 font-semibold">User:</span>
          <span id="user-display" class="text-white font-medium"></span>
        </div>
      </div>

      <!-- 連線狀態膠囊元件 -->
      <span id="server-status" class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400">
        連線中...
      </span>
    </div>

    <div class="flex items-center gap-3">
      <button id="btn-goto-tradinglog" type="button"
        class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-sm font-medium transition">
        個股交易紀錄
      </button>
      <button id="btn-mask-toggle" type="button"
        class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-medium transition">
        隱藏金額
      </button>
      <button id="btn-logout" type="button"
        class="px-3 py-1.5 rounded-lg bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-800/50 text-sm transition">
        登出
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
    <!-- 六大 KPI 指標卡片區 -->
    <section>
      <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 mb-4">帳戶財務指標彙總</h2>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
        <!-- 卡片 1: 入金合計 -->
        <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
          <div class="text-xs text-gray-400">入金合計</div>
          <div class="kpi-value text-xl font-bold mt-1 text-white">--</div>
        </div>
        <!-- 卡片 2: 利息合計 -->
        <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
          <div class="text-xs text-gray-400">利息合計</div>
          <div class="kpi-value text-xl font-bold mt-1 text-white">--</div>
        </div>
        <!-- 卡片 3: 期望回收 (含息/不含息) -->
        <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
          <div class="text-xs text-gray-400">期望回收</div>
          <div class="kpi-value text-xl font-bold mt-1 text-white">--</div>
        </div>
        <!-- 卡片 4: 當前現金 -->
        <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
          <div class="text-xs text-gray-400">當前現金餘額</div>
          <div class="kpi-value text-xl font-bold mt-1 text-white">--</div>
        </div>
        <!-- 卡片 5: 當前損益 (不含利息) -->
        <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
          <div class="text-xs text-gray-400">波段損益 (不含息)</div>
          <div class="kpi-value text-xl font-bold mt-1">--</div>
          <div id="sub-pnl-noint" class="text-xs mt-1 text-gray-400">--%</div>
        </div>
        <!-- 卡片 6: 當前損益 (含利息) -->
        <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
          <div class="text-xs text-gray-400">總體損益 (含息)</div>
          <div class="kpi-value text-xl font-bold mt-1">--</div>
          <div id="sub-pnl-int" class="text-xs mt-1 text-gray-400">--%</div>
        </div>
      </div>
    </section>

    <!-- ========================================================================= -->
    <!-- [2026-10-13] 可縮合條件搜尋區塊                                               -->
    <!-- 異動說明：                                                                 -->
    <!-- 1. 欄位順序調整為：交易類別、標的代碼、起始日期、結束日期、備註說明 (共五個欄位)    -->
    <!-- 2. 日期輸入框加入 [color-scheme:dark]，解決深色模式下日曆圖示為黑色看不見的問題     -->
    <!-- ========================================================================= -->
    <details id="filter-details"
      class="group bg-gray-800/40 border border-gray-700/50 rounded-xl overflow-hidden transition-all">
      <!-- 縮合標題列：左側文字靠左，右側白色 > / v 箭頭圖示 -->
      <summary
        class="px-6 py-3.5 flex justify-between items-center cursor-pointer select-none bg-gray-800/30 hover:bg-gray-800/60 transition-colors list-none">
        <div class="text-sm font-semibold text-gray-200">
          <span>條件搜尋篩選</span>
          <span class="text-xs font-normal text-gray-500 ml-1.5">(類別、標的代碼/名稱、起訖區間、備註)</span>
        </div>

        <!-- 右側白色箭頭：收合為 >，展開旋轉 90 度為 v -->
        <svg xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4 text-white transition-transform duration-200 group-open:rotate-90" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </summary>

      <!-- 展開後的六個搜尋條件欄位 -->
      <div class="p-6 border-t border-gray-700/50 space-y-4 bg-gray-900/30">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 text-xs">
          <!-- 欄位 1: 交易類別 -->
          <div>
            <label for="filter-trade-type" class="block font-medium text-gray-400 mb-1.5">交易類別</label>
            <select id="filter-trade-type"
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 cursor-pointer transition">
              <option value="">全部類別 (ALL)</option>
              <option value="BUY">買進 (BUY)</option>
              <option value="SELL">賣出 (SELL)</option>
              <option value="REVENUE">股利 (REVENUE)</option>
              <option value="INTEREST">利息 (INTEREST)</option>
              <option value="INPUT">入金 (INPUT)</option>
              <option value="OUTPUT">出金 (OUTPUT)</option>
            </select>
          </div>

          <!-- 欄位 2: 標的代碼 -->
          <div>
            <label for="filter-stock-id" class="block font-medium text-gray-400 mb-1.5">標的代碼</label>
            <input type="text" id="filter-stock-id" placeholder="例如：NVDA 或 2330"
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white uppercase placeholder-gray-600 focus:outline-none focus:border-blue-500 transition">
          </div>

          <!-- 欄位 3: 標的名稱 (新增於代碼與起始日期之間) -->
          <div>
            <label for="filter-stock-name" class="block font-medium text-gray-400 mb-1.5">標的名稱</label>
            <input type="text" id="filter-stock-name" placeholder="例如：台積電 或 輝達"
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 transition">
          </div>

          <!-- 欄位 4: 起始日期 (style="color-scheme: dark;" 強制讓瀏覽器原生日曆圖示維持白色) -->
          <div>
            <label for="filter-start-date" class="block font-medium text-gray-400 mb-1.5">起始日期</label>
            <input type="date" id="filter-start-date" style="color-scheme: dark;"
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 transition">
          </div>

          <!-- 欄位 5: 結束日期 (style="color-scheme: dark;" 強制讓瀏覽器原生日曆圖示維持白色) -->
          <div>
            <label for="filter-end-date" class="block font-medium text-gray-400 mb-1.5">結束日期</label>
            <input type="date" id="filter-end-date" style="color-scheme: dark;"
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 transition">
          </div>

          <!-- 欄位 6: 備註說明 -->
          <div>
            <label for="filter-note" class="block font-medium text-gray-400 mb-1.5">備註</label>
            <input type="text" id="filter-note" placeholder="關鍵字搜尋"
              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white placeholder-gray-600 focus:outline-none focus:border-blue-500 transition">
          </div>
        </div>

        <!-- 按鈕操作與不分頁合計顯示區 -->
        <!-- [2026-10-14] 異動說明：將 flex 改為 justify-between，左側呈現條件篩選後的不分頁合計(不含息/含息) -->

        <!-- 左側合計結果區 -->
        <div class="flex flex-wrap justify-between items-center gap-3 pt-2">
          <!-- 不分頁合計顯示元件 -->
          <div class="text-xs text-gray-300 font-medium">
            <span>不分頁合計(不含息/含息)：</span>
            <span id="filter-summary-no-int" class="font-bold text-gray-200">--</span>
            <span class="text-gray-500 mx-1">/</span>
            <span id="filter-summary-with-int" class="font-bold text-gray-200">--</span>
          </div>
        <!-- 右側按鈕操作區 -->
        <div class="flex justify-between items-center gap-3 pt-2">
          <button type="button" id="btn-filter-reset"
            class="px-3.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-medium border border-gray-700 transition">
            重置條件
          </button>
          <button type="button" id="btn-filter-search"
            class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium transition shadow-sm">
            執行查詢
          </button>
        </div>
      </div>
    </details>

    <!-- 近期交易流水帳表格 -->
    <section class="bg-gray-800/40 border border-gray-700/50 rounded-xl overflow-hidden">
      <!-- 2026.10.09 feat: 區塊標頭整合總筆數與頂部分頁控制器，風格與 tradinglog 一致 -->
      <div class="px-6 py-4 border-b border-gray-700/50 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
          <h2 class="font-semibold text-white">收支明細</h2>
          <span id="ledger-count" class="text-xs text-gray-400">共 0 筆</span>
        </div>

        <!-- 2026.10.09 feat: 頂部分頁控制介面 (全部/10/20/50/100，預設 10) -->
        <div class="flex items-center gap-3 text-xs">
          <!-- 每頁筆數下拉選單 -->
          <div class="flex items-center gap-1.5">
            <label for="select-page-size" class="text-gray-400">每頁：</label>
            <select id="select-page-size"
              class="bg-gray-800 border border-gray-700 text-gray-200 rounded px-2 py-1 focus:outline-none focus:border-blue-500">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="ALL">全部</option>
            </select>
          </div>

          <!-- 上一頁 / 當前頁數 / 下一頁按鈕群組 -->
          <div class="flex items-center gap-1.5">
            <button type="button" id="btn-prev-page"
              class="px-2 py-1 rounded bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed">上一頁</button>
            <span id="page-indicator" class="text-gray-400 px-1">第 1 / 1 頁</span>
            <button type="button" id="btn-next-page"
              class="px-2 py-1 rounded bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed">下一頁</button>
          </div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-800/60 text-xs uppercase text-gray-400 border-b border-gray-700/50">
            <tr>
              <!-- 2026.10.09 feat: 新增最左側序號欄位，寬度固定並置中呈現 -->
              <th class="px-4 py-3 text-center w-16">序號</th>
              <th class="px-6 py-3">交易日期</th>
              <th class="px-6 py-3">標的代碼</th>
              <th class="px-6 py-3">交易類別</th>
              <th class="px-6 py-3 text-right">進款 (Net+)</th>
              <th class="px-6 py-3 text-right">出款 (Net-)</th>
              <th class="px-6 py-3">備註說明</th>
            </tr>
          </thead>
          <tbody id="ledger-body" class="divide-y divide-gray-800">
            <tr>
              <!-- 2026.10.09 feat: 配合新增序號欄位，跨欄數由 6 調整為 7 -->
              <td colspan="7" class="text-center py-8 text-gray-500">
                載入資料庫紀錄中...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 2026.10.09 feat: 底部分頁控制列，提供滾動至底部時直接翻頁操作 (與頂部同步) -->
      <div
        class="px-6 py-3 border-t border-gray-700/50 flex flex-wrap justify-between items-center gap-3 bg-gray-800/20">
        <span id="ledger-count-bottom" class="text-xs text-gray-400">共 0 筆</span>

        <div class="flex items-center gap-3 text-xs">
          <!-- 底部每頁筆數下拉選單 -->
          <div class="flex items-center gap-1.5">
            <label for="select-page-size-bottom" class="text-gray-400">每頁：</label>
            <select id="select-page-size-bottom"
              class="bg-gray-800 border border-gray-700 text-gray-200 rounded px-2 py-1 focus:outline-none focus:border-blue-500">
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="ALL">全部</option>
            </select>
          </div>

          <!-- 底部上一頁 / 當前頁數 / 下一頁按鈕群組 -->
          <div class="flex items-center gap-1.5">
            <button type="button" id="btn-prev-page-bottom"
              class="px-2 py-1 rounded bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed">上一頁</button>
            <span id="page-indicator-bottom" class="text-gray-400 px-1">第 1 / 1 頁</span>
            <button type="button" id="btn-next-page-bottom"
              class="px-2 py-1 rounded bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed">下一頁</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 依序載入認證與資料渲染腳本 -->
  <script src="./src/js/client-auth.js"></script>
  <script src="./src/js/dashboard.js"></script>
</body>

</html>
