<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWeb - 個股波段交易紀錄</title>
  <!-- 載入 Tailwind CSS 核心樣式 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入專屬 CSS (包含去股票化商務配色、Badge 等樣式定義) -->
  <link rel="stylesheet" href="./src/css/tradinglog.css">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
  <!-- 頂部導航列 (企業內部控制台風格) -->
  <header
    class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-gray-400 hover:text-white transition text-sm">
        ← 回到主儀表板
      </a>
      <span class="text-gray-600">|</span>

      <!-- 標的下拉選單 (預設為空值，由 tradinglog.js 載入可用標的清單) -->
      <div class="flex items-center gap-2">
        <label for="select-stock" class="text-xs text-gray-400 font-medium">標的：</label>
        <select id="select-stock"
          class="bg-gray-800 border border-gray-700 text-sm font-semibold rounded px-2.5 py-1 text-blue-400 focus:outline-none focus:border-blue-500">
          <option value="">-- 請選擇標的 --</option>
        </select>
      </div>

      <!-- 回合下拉選單 (未選擇標的前保持 disabled 停用狀態) -->
      <div class="flex items-center gap-2">
        <label for="select-round" class="text-xs text-gray-400 font-medium">回合：</label>
        <select id="select-round" disabled
          class="bg-gray-800 border border-gray-700 text-sm rounded px-2.5 py-1 text-white focus:outline-none focus:border-blue-500 disabled:opacity-50">
          <option value="">-- 請先選擇標的 --</option>
        </select>
      </div>
    </div>

    <!-- 右側功能按鈕區 -->
    <div class="flex items-center gap-3">
      <!-- 標的代碼維護按鈕 (SaaS 次要動作按鈕樣式，呼叫新增標的彈窗) -->
      <button id="btn-open-stock-modal" type="button"
        class="px-3.5 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 text-sm font-medium transition shadow-sm">
        + 標的維護
      </button>

      <!-- 新增交易明細按鈕 (主要動作按鈕) -->
      <button id="btn-open-modal" type="button"
        class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-sm font-medium transition shadow-sm">
        + 新增交易記錄
      </button>

      <!-- 登出按鈕 -->
      <button id="btn-logout" type="button"
        class="px-3 py-1.5 rounded-lg bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-800/50 text-sm transition">
        登出
      </button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">
    <!-- 5 大 KPI 指標卡片區 (桌機版 lg: 保持 5 欄完整橫排) -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
      <!-- 1. 目前持股餘額 -->
      <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-400">目前持股餘額</div>
        <div id="stat-shares" class="text-xl font-bold mt-1 text-white">-- 股</div>
      </div>

      <!-- 2. 平均持有成本 -->
      <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-400">平均持有成本</div>
        <div id="stat-avg-cost" class="text-xl font-bold mt-1 text-white">--</div>
      </div>

      <!-- 3. 累計投入本金 (買進 net_total 總額) -->
      <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-400">累計投入本金 (買進)</div>
        <div id="stat-buy-cost" class="text-xl font-bold mt-1 text-white">--</div>
      </div>

      <!-- 4. 已實現收入 (賣出 net_total + 股利/利息) -->
      <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50">
        <div class="text-xs text-gray-400">已實現收入 (賣出/配息)</div>
        <div id="stat-revenue" class="text-xl font-bold mt-1 text-white">--</div>
      </div>

      <!-- 5. 損益合計：未選回合時為全部歷史損益，選定回合時為該單一回合波段損益 -->
      <div class="p-4 rounded-xl bg-gray-800/50 border border-gray-700/50 col-span-2 md:col-span-1">
        <div class="text-xs text-gray-400">損益合計</div>
        <div id="stat-pnl" class="text-xl font-bold mt-1 text-gray-400">--</div>
      </div>
    </div>

    <!-- 標的歷史交易明細流水帳區塊 -->
    <div class="bg-gray-800/40 border border-gray-700/50 rounded-xl overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-700/50 flex justify-between items-center">
        <h2 class="font-semibold text-white">歷史交易流水帳</h2>
        <span id="log-count" class="text-xs text-gray-400">共 0 筆</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-800/60 text-xs uppercase text-gray-400 border-b border-gray-700/50">
            <tr>
              <th class="px-4 py-3">交易日</th>
              <th class="px-4 py-3">類別</th>
              <th class="px-4 py-3 text-right">單價</th>
              <th class="px-4 py-3 text-right">股數</th>
              <th class="px-4 py-3 text-right">手續費</th>
              <th class="px-4 py-3 text-right">交易稅</th>
              <th class="px-4 py-3 text-right">收付淨額</th>
              <th class="px-4 py-3">備註說明</th>
              <th class="px-4 py-3 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="trade-log-body" class="divide-y divide-gray-800">
            <!-- 預設占位列：未選擇標的或未選擇回合時，由 JS 動態切換提示文字 (擴充為 9 欄) -->
            <tr>
              <td colspan="9" class="text-center py-8 text-gray-500">
                請先由上方選單選擇標的代碼
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ========================================================================= -->
  <!-- 彈窗 1：新增 / 編輯交易明細彈窗 (Modal：共用元件) -->
  <!-- ========================================================================= -->
  <div id="modal-add-trade"
    class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-xl w-full max-w-md p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <!-- 動態標題：由 JS 切換「新增交易明細」或「編輯交易明細」 -->
        <h3 id="modal-title" class="font-bold text-white">新增交易明細</h3>
        <button id="btn-close-modal" type="button" class="text-gray-400 hover:text-white">✕</button>
      </div>

      <form id="form-trade" class="space-y-3" onsubmit="return false;">
        <!-- 隱藏欄位：儲存欲編輯的 trade_id (新增模式時為空字串) -->
        <input type="hidden" id="input-trade-id" value="">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400">標的代碼</label>
            <!-- 加上 readonly 與 disabled 樣式，鎖定禁止使用者手動改寫 -->
            <input type="text" id="input-stock-id" required readonly
              class="w-full mt-1 bg-gray-950 border border-gray-700/60 rounded px-3 py-1.5 text-gray-300 uppercase text-sm cursor-not-allowed opacity-75 focus:outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-400">回合 (Round)</label>
            <!-- 改為 type="number"，限定最少為 0 的整數 -->
            <input type="number" id="input-round" min="0" step="1" value="0" required
              class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm focus:outline-none focus:border-blue-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400">交易日期</label>
            <input type="date" id="input-trade-date" required
              class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-400">交易型態</label>
            <select id="input-trade-type"
              class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm">
              <option value="BUY">買進 (BUY)</option>
              <option value="SELL">賣出 (SELL)</option>
              <option value="REVENUE">股息 (REVENUE)</option>
              <option value="INTEREST">利息 (INTEREST)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400">單價</label>
            <input type="number" step="0.0001" id="input-price" placeholder="0.00"
              class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-400">股數</label>
            <input type="number" id="input-shares" placeholder="0"
              class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400">手續費</label>
            <input type="number" id="input-fee" value="0"
              class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm">
          </div>
          <div>
            <label class="text-xs text-gray-400">證券交易稅</label>
            <input type="number" id="input-tax" value="0"
              class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm">
          </div>
        </div>

        <div>
          <label class="text-xs text-gray-400">備註說明</label>
          <input type="text" id="input-note" placeholder="選填"
            class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm">
        </div>

        <div class="pt-2">
          <button type="button" id="btn-submit-trade"
            class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-white font-medium text-sm transition">
            <span id="btn-submit-trade-text">確認送出儲存</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- 彈窗 2：標的代碼維護 (單純新增標的) 彈窗 (Modal) -->
  <!-- ========================================================================= -->
  <div id="modal-stock-comp"
    class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-gray-800 border border-gray-700 rounded-xl w-full max-w-sm p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 class="font-bold text-white">標的代碼維護</h3>
        <button id="btn-close-stock-modal" type="button" class="text-gray-400 hover:text-white">✕</button>
      </div>

      <form id="form-stock-comp" class="space-y-4" onsubmit="return false;">
        <div>
          <label class="text-xs text-gray-400 font-medium">標的代碼 (Symbol / ID)</label>
          <input type="text" id="input-new-stock-id" required placeholder="例如：2330 或 NVDA"
            class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white uppercase text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 font-medium">標的名稱 (Name)</label>
          <input type="text" id="input-new-stock-name" required placeholder="例如：台積電 或 輝達"
            class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-3 py-1.5 text-white text-sm focus:outline-none focus:border-blue-500">
        </div>

        <div class="pt-2">
          <button type="button" id="btn-submit-stock-comp"
            class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg text-white font-medium text-sm transition">
            儲存至標的名單
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 依序載入驗證守衛與個股資料操作邏輯 -->
  <script src="./src/js/client-auth.js"></script>
  <script src="./src/js/tradinglog.js"></script>
</body>

</html>
