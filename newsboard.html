<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWeb - Newsboard</title>

  <!-- 宣告藍色折線圖 Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 7 13.5 15.5 8.5 10.5 2 17'%3E%3C/polyline%3E%3Cpolyline points='16 7 22 7 22 13'%3E%3C/polyline%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN (與 dashboard.html 對齊) -->
  <script src="https://cdn.tailwindcss.com"></script>

  
  <!-- [2026-11-03] feat: 載入 Clerk 前端 SDK，供 client-auth.js 身分鑑權取得 Token，防止未認證跳轉 -->
  <script defer crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_YWN0aXZlLW9jdG9wdXMtMjgzNi5jbGVyay5hY2NvdW50cy5kZXYk"
    src="https://active-octopus-2836.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js">
  </script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
  <!-- 頂部導航列 (風格完全對齊 dashboard.html) -->
  <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="text-blue-500">StockWeb</span> News
      </h1>

      <!-- 市場與使用者身分展示膠囊 -->
      <div id="badge-market-container"
        class="flex items-center gap-2 px-3 py-1 rounded-full text-xs font-medium bg-blue-900/60 text-blue-300 border border-blue-700/50">
        <!--[2026-11-09] feat: 將原純文字 span 調整為下拉選單固定 TW 與 US) -->
        <div class="flex items-center gap-1">
          <label for="market-select" class="text-blue-400 font-semibold cursor-pointer">Market:</label>
          <select id="market-select" class="bg-blue-950 text-white font-semibold rounded px-1.5 py-0.5 border border-blue-700/60 focus:outline-none focus:ring-1 focus:ring-blue-400 text-xs">
            <option value="TW">TW</option>
            <option value="US">US</option>
          </select>
        </div>

        <span class="text-blue-700/80">|</span>

        <!-- 2. User: 帳號明碼呈現 -->
        <div class="flex items-center gap-1">
          <span class="text-blue-400 font-semibold">User:</span>
          <span id="user-display" class="text-white font-medium"></span>
        </div>
      </div>

      <!-- 連線狀態膠囊元件 -->
      <span id="server-status" class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-800 text-gray-400">
        連線中...
      </span>
    </div>

    <!-- 右側功能按鈕區 -->
    <div class="flex items-center gap-3">
      <!-- 前往主儀表板按鈕 (連至 dashboard.html) -->
      <button id="btn-goto-dashboard" type="button"
        class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-sm font-medium transition shadow-sm">
        進入主儀表板 &rarr;
      </button>
      <!-- 登出按鈕 -->
      <button id="btn-logout" type="button"
        class="px-3 py-1.5 rounded-lg bg-red-950/40 hover:bg-red-900/60 text-red-300 border border-red-800/50 text-sm transition">
        登出
      </button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">
    <!-- 說明標題列 -->
    <div class="flex flex-wrap justify-between items-center gap-2">
      <div>
        <!-- [2026-11-05] feat: 標題後方附加最新取得時間顯示 -->
        <h2 class="text-lg font-bold text-white tracking-tight">
          Announcement
          <span class="text-xs font-normal text-gray-400 ml-1">
            (最新取得時間: <span id="latest-crtdt-display" class="font-mono text-gray-300">--</span>)
          </span>
        </h2>
        <p class="text-xs text-gray-400 mt-0.5">依據目前設定追蹤之標的，列出今日之後，除權除息未發放之前的通知</p>
      </div>
    </div>

    <!-- 除權息清單表格區塊 -->
    <section class="bg-gray-800/40 border border-gray-700/50 rounded-xl overflow-hidden">
      <!-- 載入中狀態提示 -->
      <div id="loading-msg" class="text-center py-12 text-gray-400 text-sm">
        正在讀取最新除權息資料...
      </div>

      <!-- 無資料提示 (預設隱藏) -->
      <div id="empty-msg" style="display: none;" class="text-center py-12 text-gray-500 text-sm">
        目前追蹤標的近期尚無除權息消息。
      </div>

      <!-- 資料表格 (預設隱藏) -->
      <div class="overflow-x-auto">
        <table id="news-table" style="display: none;" class="w-full text-left text-sm text-gray-300">
          <thead class="bg-gray-800/60 text-xs uppercase text-gray-400 border-b border-gray-700/50">
            <tr>
              <th class="px-6 py-3">股票代碼</th>
              <th class="px-6 py-3">標的名稱</th>
              <!-- [2026-11-03] feat: 在標的名稱之後、除權息日期之前新增最後買進日欄位 -->
              <th class="px-6 py-3">最後買進日</th>
              <th class="px-6 py-3">除權息日期</th>
              <th class="px-6 py-3 text-right">現金股利 (元/股)</th>
              <th class="px-6 py-3 text-right">股票股利 (股)</th>
              <!-- [2026-11-03] feat: 發放日欄位調整至最後一欄 -->
              <th class="px-6 py-3">發放日</th>
            </tr>
          </thead>
          <tbody id="news-body" class="divide-y divide-gray-800">
            <!-- 由 newsboard.js 動態渲染內容 -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 依序載入認證與資料渲染腳本 (與 dashboard.html 對齊) -->
  <script src="./src/js/client-auth.js"></script>
  <script src="./src/js/newsboard.js"></script>
</body>

</html>
