<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockWeb</title>

    <!-- 加入瀏覽器頁籤的圖示 (Favicon) -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233B82F6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='22 7 13.5 15.5 8.5 10.5 2 17'/><polyline points='16 7 22 7 22 13'/></svg>">

    <!-- 載入登入頁樣式表 -->
    <link rel="stylesheet" href="src/css/auth.css">

    <!-- 載入 Clerk 前端 SDK -->
    <script defer crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_YWN0aXZlLW9jdG9wdXMtMjgzNi5jbGVyay5hY2NvdW50cy5kZXYk"
        src="https://active-octopus-2836.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js">
    </script>
</head>

<body class="login-page">
    <div class="login-container">
        <main class="login-card">

            <!-- 系統品牌識別區塊 -->
            <header class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                </div>
                <h1>StockWeb</h1>
            </header>

            <!-- 登入表單 -->
            <form id="login-form">
                <div class="input-group">
                    <label for="input-username">使用者帳號 / Email</label>
                    <input type="text" id="input-username" name="username" placeholder="請輸入使用者帳號或 Email" required
                        autocomplete="username" spellcheck="false">
                </div>

                <div class="input-group">
                    <label for="input-password">密碼</label>
                    <div style="position: relative; width: 100%;">
                        <input type="password" id="input-password" name="password" placeholder="請輸入密碼" required
                            autocomplete="current-password"
                            style="width: 100%; padding-right: 40px; box-sizing: border-box;">

                        <button type="button" id="btn-toggle-password" onclick="togglePasswordVisibility()"
                            tabindex="-1"
                            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; color: #ffffff;"
                            aria-label="切換密碼顯示">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                                fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 市場切換 -->
                <div class="input-group">
                    <label id="market-group-label">管理市場環境</label>
                    <div class="market-toggle-group" role="radiogroup" aria-labelledby="market-group-label">
                        <label class="market-option">
                            <input type="radio" name="market" value="TW" checked>
                            <span class="market-card">
                                <strong>TW</strong>
                                <small>NTD</small>
                            </span>
                        </label>
                        <label class="market-option">
                            <input type="radio" name="market" value="US">
                            <span class="market-card">
                                <strong>US</strong>
                                <small>USD</small>
                            </span>
                        </label>
                    </div>
                </div>

                <button type="submit" id="btn-login" class="btn-login">進入管理系統</button>
            </form>

            <!-- 頁腳資訊與版號顯示區塊 -->
            <footer class="security-notice">
                <p class="copyright">© 2026 StockWeb Project</p>
                <span id="app-version-display" style="display: block; font-size: 11px; opacity: 0.7; margin-top: 4px;">載入版號中...</span>
            </footer>

        </main>
    </div>

    <!-- 載入版號資訊腳本 -->
    <script>
        // 加入時間戳記避免瀏覽器讀取到快取舊檔案
        const versionEndpoint = '/version.json?t=' + Date.now();

        // 變數用途：取得頁尾版號顯示的 DOM 節點
        const versionElement = document.getElementById('app-version-display');

        fetch(versionEndpoint)
            .then((response) => {
                // 檢查伺服器回應狀態
                if (!response.ok) {
                    throw new Error('無法讀取版號檔案');
                }
                return response.json();
            })
            .then((data) => {
                // 將取得的版號字串渲染至畫面
                if (versionElement && data.version) {
                    versionElement.textContent = data.version;
                }
            })
            .catch((error) => {
                // 若載入失敗，清空預設文字並於主控台提示，不影響頁面其他功能
                console.warn('載入版本資訊失敗:', error);
                if (versionElement) {
                    versionElement.textContent = '';
                }
            });
    </script>

    <!-- 登入邏輯控制腳本 -->
    <script src="src/js/client-login.js"></script>
</body>

</html>
