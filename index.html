<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockWeb</title>
    <link rel="stylesheet" href="src/css/auth.css">
</head>
<body class="login-page">

    <div class="login-container">
        <main class="login-card">
            
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                </div>
                <h1>StockWeb</h1>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">使用者帳號</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="請輸入使用者名稱" 
                        required 
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>

                <div class="input-group">
                    <label for="password">密碼</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="請輸入密碼" 
                        required
                    >
                </div>

                <!-- 市場別選擇切換按鈕組 -->
                <div class="input-group">
                    <label>管理市場環境</label>
                    <div class="market-toggle-group">
                        <label class="market-option">
                            <input type="radio" name="market" value="TW" checked>
                            <span class="market-card">
                                <strong>TW</strong>
                                <small>NTD</small>
                            </span>
                        </label>
                        <label class="market-option">
                            <input type="radio" name="market" value="US">
                            <span class="market-card">
                                <strong>US</strong>
                                <small>USD</small>
                            </span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-login">進入管理系統</button>
            </form>

            <footer class="security-notice">
                <p>受 ISO 27000 規範保護之存取控制系統，請勿於未授權裝置操作。</p>
                <p class="copyright">© 2026 StockWeb Project</p>
            </footer>
        </main>
    </div>

    <script src="src/js/auth.js"></script>
</body>
</html>
